# Single workspace for every app and shared package.
#
# Apps MUST be members rather than separately-installed projects: the shared
# packages declare react and react-query as peers, and only one dependency tree
# can guarantee a single copy of each. Two trees produce two React contexts, so
# a hook from a shared package would look up a QueryClientProvider the app never
# rendered and throw at runtime.
packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@azure/msal-node-extensions': true
  '@azure/msal-node-runtime': true
  esbuild: true
  keytar: true
